<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài tập CSS Box Model - So sánh content-box và border-box</title>
    <!-- Liên kết tới file CSS riêng biệt -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h2>So sánh CSS Box Model (content-box vs border-box)</h2>

    <!-- Thẻ 1: content-box (Màu xanh lá) -->
    <div class="card">
        <h3>Card 1 (content-box)</h3>
        <p>Kích thước thực tế sẽ bị cộng thêm Padding và Border.</p>
    </div>

    <!-- Thẻ 2: border-box (Màu vàng) -->
    <div class="card">
        <h3>Card 2 (border-box)</h3>
        <p>Kích thước thực tế cố định đúng 280px x 150px.</p>
    </div>

    <!-- Thẻ 3: border-box (Màu đỏ) -->
    <div class="card">
        <h3>Card 3 (border-box)</h3>
        <p>Kích thước giống Card 2 nhưng khác màu nền.</p>
    </div>

</body>
</html>
